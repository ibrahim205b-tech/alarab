<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مولّد أكواد التفعيل — مبيعات علي العراب</title>
<style>
  :root { --gold:#D9B25F; --gold2:#F4DB97; --ink:#0D1015; --card:#1B222B; --line:#2A323D; --muted:#9AA3AF; --ok:#2FBF71; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,"Segoe UI",Tahoma,sans-serif; background:
      radial-gradient(600px 600px at 80% 0%, rgba(217,178,95,.18), transparent 60%),
      radial-gradient(600px 600px at 10% 100%, rgba(20,184,166,.12), transparent 60%), var(--ink);
      color:#fff; min-height:100vh; padding:20px; }
  .wrap { max-width:460px; margin:0 auto; }
  .logo { width:76px; height:76px; border-radius:22px; margin:8px auto 14px;
      background:linear-gradient(135deg,var(--gold2),var(--gold),#8E6A22); display:grid; place-items:center;
      box-shadow:0 12px 34px rgba(217,178,95,.45); }
  .logo svg { width:44px; height:44px; }
  h1 { text-align:center; font-size:22px; margin:0 0 4px; }
  .sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:14px; }
  label { display:block; font-weight:700; margin-bottom:8px; font-size:15px; }
  input[type=text] { width:100%; padding:14px; border-radius:14px; border:1px solid var(--line);
      background:#131920; color:#fff; font-size:18px; font-weight:700; text-align:center; letter-spacing:1px; }
  input:focus { outline:none; border-color:var(--gold); }
  .durations { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .dur { flex:1 1 28%; padding:12px 6px; border-radius:14px; border:1px solid var(--line); background:#131920;
      color:#fff; font-weight:800; font-size:15px; cursor:pointer; text-align:center; }
  .dur.on { background:rgba(217,178,95,.2); border-color:var(--gold); color:var(--gold2); }
  button.go { width:100%; padding:16px; border:none; border-radius:16px; cursor:pointer; margin-top:6px;
      background:linear-gradient(135deg,var(--gold2),var(--gold)); color:var(--ink); font-size:18px; font-weight:800; }
  .result { display:none; text-align:center; }
  .result.show { display:block; }
  .code { font-size:30px; font-weight:800; letter-spacing:3px; margin:10px 0; color:var(--gold2);
      direction:ltr; user-select:all; word-break:break-all; }
  .meta { color:var(--muted); font-size:14px; line-height:1.9; }
  .copy { margin-top:10px; padding:12px 20px; border-radius:12px; border:1px solid var(--gold);
      background:transparent; color:var(--gold2); font-weight:800; cursor:pointer; }
  .copy.done { background:var(--ok); border-color:var(--ok); color:#fff; }
  details { margin-top:6px; } summary { color:var(--muted); cursor:pointer; font-size:13px; }
  details input { font-size:12px; font-weight:400; letter-spacing:0; text-align:left; direction:ltr; margin-top:8px; }
  .err { color:#E5484D; text-align:center; font-weight:700; margin-top:10px; min-height:20px; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:16px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg viewBox="0 0 24 24" fill="#0D1015"><path d="M21.9 8.89l-1.05-4.37c-.22-.9-1-1.52-1.91-1.52H5.05c-.9 0-1.69.63-1.9 1.52L2.1 8.89c-.24 1.02-.02 2.06.62 2.88.08.11.19.19.28.29V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6.94c.09-.09.2-.18.28-.28.64-.82.87-1.87.62-2.89zM13 5h1.96l.54 4.52c.05.39-.07.78-.33 1.07-.22.26-.54.41-.95.41-.67 0-1.22-.59-1.22-1.31V5zM8.49 9.52L9.04 5H11v4.69c0 .72-.55 1.31-1.29 1.31-.34 0-.65-.15-.89-.41-.25-.29-.37-.68-.33-1.07zm-4.45-.16L5.05 5h1.97l-.58 4.86c-.08.65-.6 1.14-1.21 1.14-.49 0-.8-.29-.93-.47-.27-.34-.36-.79-.26-1.17zM5 19v-6.03c.08.01.15.03.23.03.87 0 1.66-.36 2.24-.95.6.6 1.4.95 2.31.95.87 0 1.65-.36 2.23-.93.59.57 1.39.93 2.29.93.84 0 1.64-.35 2.24-.95.58.59 1.37.95 2.24.95.08 0 .15-.02.23-.03V19H5z"/></svg></div>
  <h1>مولّد أكواد التفعيل</h1>
  <div class="sub">مبيعات علي العراب — يعمل بدون إنترنت</div>

  <div class="card">
    <label>رمز الجهاز (من شاشة التفعيل عند الزبون)</label>
    <input id="device" type="text" placeholder="ALRB-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <label style="margin-top:16px">مدة الاشتراك</label>
    <div class="durations" id="durs">
      <div class="dur" data-days="7">7 أيام</div>
      <div class="dur" data-months="1">شهر</div>
      <div class="dur" data-months="3">3 أشهر</div>
      <div class="dur on" data-months="6">6 أشهر</div>
      <div class="dur" data-months="12">سنة</div>
    </div>
    <details>
      <summary>المفتاح السري (متقدّم — لا تغيّره إلا إذا غيّرته في البرنامج)</summary>
      <input id="secret" type="text" value="a95296fdacc0eddc8568ff02c43cd097aed36e010645e830051b3f3cea16ac8f">
    </details>
    <button class="go" onclick="gen()">توليد الكود</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card result" id="result">
    <div class="meta" id="meta"></div>
    <div class="code" id="code"></div>
    <button class="copy" id="copy" onclick="copyCode()">نسخ الكود</button>
  </div>

  <div class="foot">
    احتفظ بهذا الملف لنفسك ولا تنشره.<br>
    تطوير: المطور ابراهيم علي
  </div>
</div>

<script>
const ALPH = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
let days = 180;

document.querySelectorAll('.dur').forEach(el => el.onclick = () => {
  document.querySelectorAll('.dur').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
  days = el.dataset.days ? +el.dataset.days : +el.dataset.months * 30;
});

function normalize(s) {
  return s.toUpperCase().split('').map(c => c === 'I' || c === 'L' ? '1' : c === 'O' ? '0' : c === 'U' ? 'V' : c)
    .filter(c => ALPH.includes(c)).join('');
}
function canonicalDevice(s) { return normalize(s.replace(/^ALRB/i, '')); }

function b32(bytes) {
  let bits = 0, val = 0, out = '';
  for (const b of bytes) { val = (val << 8) | b; bits += 8; while (bits >= 5) { out += ALPH[(val >> (bits - 5)) & 31]; bits -= 5; } }
  if (bits > 0) out += ALPH[(val << (5 - bits)) & 31];
  return out;
}

async function hmac(secret, msg) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(msg));
  return new Uint8Array(sig);
}

async function gen() {
  const err = document.getElementById('err');
  const device = canonicalDevice(document.getElementById('device').value);
  const secret = document.getElementById('secret').value.trim();
  if (device.length !== 12) { err.textContent = 'رمز الجهاز غير صحيح (يجب أن يكون 16 رمزاً)'; return; }
  err.textContent = '';
  const expiry = new Date(Date.now() + days * 86400000);
  const expiryDays = Math.floor(expiry.getTime() / 86400000);
  const sig = (await hmac(secret, device + ':' + expiryDays)).slice(0, 4);
  const payload = [(expiryDays >> 8) & 0xff, expiryDays & 0xff, ...sig];
  const code = b32(payload);
  const formatted = code.slice(0, 5) + '-' + code.slice(5, 10);
  document.getElementById('code').textContent = formatted;
  document.getElementById('meta').innerHTML =
    'رمز الجهاز: <b dir=ltr>' + document.getElementById('device').value.toUpperCase() + '</b><br>' +
    'المدة: <b>' + (days % 30 === 0 ? (days / 30) + ' شهر' : days + ' يوم') + '</b> — ينتهي ' + expiry.toISOString().slice(0, 10);
  document.getElementById('result').classList.add('show');
  const cp = document.getElementById('copy'); cp.classList.remove('done'); cp.textContent = 'نسخ الكود';
}

function copyCode() {
  const t = document.getElementById('code').textContent;
  navigator.clipboard.writeText(t).then(() => {
    const cp = document.getElementById('copy'); cp.classList.add('done'); cp.textContent = 'تم النسخ ✓';
  });
}
</script>
</body>
</html>
