name: بناء APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: الاختبارات
        run: flutter test

      - name: مفتاح التوقيع من الأسرار (اختياري)
        env:
          KEYSTORE_B64: ${{ secrets.ALARAB_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ALARAB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ALARAB_KEYSTORE_PASSWORD=${{ secrets.ALARAB_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ALARAB_KEY_ALIAS=${{ secrets.ALARAB_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ALARAB_KEY_PASSWORD=${{ secrets.ALARAB_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: بناء APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/alarab-v1.0.${{ github.run_number }}.apk"

      - name: رفع الملف
        uses: actions/upload-artifact@v4
        with:
          name: alarab-apk
          path: out/*.apk

      - name: إصدار للتحميل المباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مبيعات علي العراب v1.0.${{ github.run_number }}
          body: |
            نسخة جديدة من تطبيق **مبيعات علي العراب**.
            حمّل ملف APK من الأسفل وثبّته على الجهاز (تابلت أو موبايل).
          files: out/*.apk
          make_latest: true
