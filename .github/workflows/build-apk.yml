name: بناء APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SECRET_KEY: ${{ secrets.ALARAB_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: تثبيت الحزم
        run: flutter pub get

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: الاختبارات
        run: flutter test

      # التوقيع: مفتاح ثابت ضروري حتى تُثبَّت التحديثات فوق النسخة القديمة بدون حذف البيانات.
      # 1) إن وُجد السر ALARAB_KEYSTORE_BASE64 يُستخدم (الطريقة الدائمة الموصى بها)
      # 2) وإلا يُنشأ مفتاح مرة واحدة ويُحفظ في ذاكرة GitHub Actions الخاصة بالمستودع
      - name: مفتاح التوقيع من الأسرار
        if: env.HAS_SECRET_KEY == 'true'
        run: |
          echo "${{ secrets.ALARAB_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ALARAB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ALARAB_KEYSTORE_PASSWORD=${{ secrets.ALARAB_KEYSTORE_PASSWORD }}"
            echo "ALARAB_KEY_ALIAS=${{ secrets.ALARAB_KEY_ALIAS }}"
            echo "ALARAB_KEY_PASSWORD=${{ secrets.ALARAB_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: استرجاع مفتاح التوقيع المحفوظ
        if: env.HAS_SECRET_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.alarab-signing
          key: alarab-signing-key-v1

      - name: تجهيز مفتاح التوقيع
        if: env.HAS_SECRET_KEY != 'true'
        run: |
          D="$HOME/.alarab-signing"
          mkdir -p "$D"
          if [ ! -f "$D/release.jks" ]; then
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$D/release.jks" -alias alarab -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Ali Alarab, O=Alarab Sales, C=IQ"
            printf '%s' "$PASS" > "$D/pass"
            echo "تم إنشاء مفتاح توقيع جديد"
          fi
          PASS=$(cat "$D/pass")
          echo "::add-mask::$PASS"
          {
            echo "ALARAB_KEYSTORE_PATH=$D/release.jks"
            echo "ALARAB_KEYSTORE_PASSWORD=$PASS"
            echo "ALARAB_KEY_ALIAS=alarab"
            echo "ALARAB_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: بناء APK
        run: |
          SECRET="${{ secrets.ALARAB_LICENSE_SECRET }}"
          if [ -n "$SECRET" ]; then DEFINE="--dart-define=ALARAB_LICENSE_SECRET=$SECRET"; fi
          flutter build apk --release --build-number=${{ github.run_number }} $DEFINE
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/alarab-v1.1.${{ github.run_number }}.apk"

      - name: رفع الملف
        uses: actions/upload-artifact@v4
        with:
          name: alarab-apk
          path: out/*.apk

      - name: إصدار للتحميل المباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: نظام المبيعات v1.1.${{ github.run_number }}
          body: |
            نسخة جديدة من البرنامج.
            حمّل ملف APK من الأسفل وثبّته على الجهاز (تابلت أو موبايل).
          files: out/*.apk
          make_latest: true
