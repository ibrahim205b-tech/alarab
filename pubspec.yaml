name: alarab
description: "نظام مبيعات متكامل لمحلات الهواتف: بيع، صيانة، خطوط، مخزن وديون"
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.5
  path: ^1.9.1
  provider: ^6.1.5
  intl: any
  http: ^1.6.0
  shared_preferences: ^2.5.6
  crypto: ^3.0.8
  pdf: ^3.13.1
  printing: ^5.15.1
  print_bluetooth_thermal: ^1.2.5
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  flutter_animate: ^4.5.2
  url_launcher: ^6.3.3
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: any

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
